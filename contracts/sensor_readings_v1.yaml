# sensor_readings_v1.yaml
# --------------------------
# Schema contract for the `sensor_readings` dataset — the contract incoming
# daily batches are validated against BEFORE being admitted into the
# lakehouse. Versioned explicitly: this is v1. See sensor_readings_v2.yaml
# for the superseding version and CHANGELOG.md for why it was bumped.

contract_name: sensor_readings
contract_version: 1
effective_date: "2026-01-01"

fields:
  - name: line_id
    type: string
    required: true
    allowed_values: [LINE-01, LINE-02, LINE-03, LINE-04]

  - name: timestamp
    type: datetime
    required: true

  - name: temperature_c
    type: float
    required: true
    min_value: 0.0
    max_value: 150.0
    drift_check: true       # this field's distribution is monitored for drift batch-over-batch
    baseline_mean: 70.0
    baseline_std: 6.0

  - name: vibration_mm_s
    type: float
    required: true
    min_value: 0.0
    max_value: 10.0
    drift_check: true
    baseline_mean: 0.85
    baseline_std: 0.15

  - name: throughput_units_min
    type: integer
    required: true
    min_value: 0
    max_value: 200

primary_key: [line_id, timestamp]
